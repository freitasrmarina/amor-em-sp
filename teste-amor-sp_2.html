<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onde você vai encontrar o amor da sua vida em SP — teste</title>
<style>
  :root{
    --papel:#FAF9F5;
    --tinta:#141310;
    --rosa:#FF2E77;
    --linha:#CFCBC0;
    --cinza:#6E6A62;
    --disp:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
           "Nimbus Sans Narrow","DejaVu Sans Condensed",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel); color:var(--tinta);
    font-family:var(--disp);
    -webkit-font-smoothing:antialiased;
    padding:0 18px 64px;
  }
  .folha{max-width:540px;margin:0 auto}

  /* ---------- topo ---------- */
  header{border-bottom:2.5px solid var(--tinta);padding:22px 0 10px;margin-bottom:22px}
  .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cinza);margin:0 0 10px
  }
  h1{
    font-family:var(--disp);font-weight:700;text-transform:uppercase;
    font-size:clamp(30px,10vw,46px);line-height:.92;letter-spacing:-.01em;margin:0
  }
  h1 em{font-style:normal;background:var(--rosa);padding:0 .12em}

  /* ---------- marcas de dobra = progresso ---------- */
  .dobras{display:flex;gap:6px;align-items:flex-end;margin:0 0 26px;height:16px}
  .dobras i{flex:1;height:3px;background:var(--linha);display:block}
  .dobras i.ok{background:var(--tinta);height:10px}
  .dobras i.now{background:var(--rosa);height:16px}
  .contador{font-family:var(--mono);font-size:10px;color:var(--cinza);letter-spacing:.1em;margin:0 0 14px}

  /* ---------- pergunta ---------- */
  .pergunta{font-size:clamp(21px,6.4vw,28px);line-height:1.08;font-weight:700;margin:0 0 20px}
  .opcoes{display:grid;gap:9px}
  button.op{
    -webkit-appearance:none;appearance:none;
    display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:1.5px solid var(--tinta);border-radius:0;
    padding:13px 14px;font-family:var(--disp);font-size:16.5px;line-height:1.25;color:var(--tinta);
    transition:background .12s linear,color .12s linear,transform .12s linear;
  }
  button.op span.k{font-family:var(--mono);font-size:11px;color:var(--cinza);flex:none;padding-top:2px}
  button.op:hover{background:var(--tinta);color:var(--papel);transform:translate(-2px,-2px)}
  button.op:hover span.k{color:var(--rosa)}
  button.op:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

  .voltar{
    margin-top:22px;background:none;border:none;padding:6px 0;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--cinza);text-decoration:underline
  }
  .voltar:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

  /* ---------- resultado ---------- */
  .carimbo{
    display:inline-block;background:var(--tinta);color:var(--papel);
    padding:9px 15px 11px;transform:rotate(-1.4deg);margin:0 0 22px
  }
  .carimbo b{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase}
  .carimbo strong{display:block;font-size:27px;line-height:1;text-transform:uppercase;font-weight:700}
  .perfil{font-size:15px;line-height:1.4;margin:0 0 26px;padding-left:12px;border-left:3px solid var(--rosa)}

  ol.res{list-style:none;margin:0 0 30px;padding:0;counter-reset:r}
  ol.res li{border-top:1.5px solid var(--tinta);padding:15px 0 16px}
  ol.res li:last-child{border-bottom:1.5px solid var(--tinta)}
  .cab{display:flex;align-items:baseline;gap:10px}
  .pos{font-family:var(--mono);font-size:11px;background:var(--rosa);padding:2px 5px;flex:none}
  .num{font-family:var(--mono);font-size:11px;color:var(--cinza);flex:none}
  .nome{font-size:20px;font-weight:700;line-height:1.05;margin:0;flex:1;text-transform:lowercase}
  .nota{font-size:14.5px;line-height:1.35;margin:5px 0 0;padding-left:0}
  .meta{font-family:var(--mono);font-size:10.5px;color:var(--cinza);letter-spacing:.06em;margin:8px 0 0;text-transform:uppercase}

  .acoes{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px}
  .acoes button{
    -webkit-appearance:none;appearance:none;cursor:pointer;border:1.5px solid var(--tinta);
    background:var(--tinta);color:var(--papel);padding:12px 16px;border-radius:0;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase
  }
  .acoes button.alt{background:transparent;color:var(--tinta)}
  .acoes button:hover{background:var(--rosa);color:var(--tinta);border-color:var(--rosa)}
  .acoes button:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="folha">
  <header>
    <p class="eyebrow">Guia de campo · São Paulo · nº 1</p>
    <h1>Onde <em>você</em><br>vai encontrar<br>o amor da<br>sua vida</h1>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ---------------- os 41 endereços, com os atributos que o teste lê ------------- */
const L = [
 ["01","bar da bete","abre 18h, fecha 6h. o amor vem na quarta hora.","vila buarque",["madrugada","calcada","conversa","nenhum","centro","historia"]],
 ["02","jhony's","uma parmegiana serve duas pessoas.","vila buarque",["noite","mesa","conversa","nenhum","centro","real"]],
 ["03","dila do z deli da república","a fila na porta é a atração.","vila buarque",["noite","mesa","conversa","fila","centro","real"]],
 ["04","feirinha do copan","todo mundo fingindo procurar disco.","república",["tarde","andando","conversa","atividade","centro","real"]],
 ["05","copanzinho","abre às 7h. cobre o fim da mesma história.","república",["manha","mesa","conversa","nenhum","centro","real"]],
 ["06","galeria metrópole","suba até o último andar.","centro",["noite","andando","conversa","nenhum","centro","historia"]],
 ["07","fila para entrar no matiz","1h30 de espera. um namoro inteiro.","centro",["noite","andando","conversa","fila","centro","historia"]],
 ["08","rua guaianases, 93","campos elíseos. você sabe.","campos elíseos",["madrugada","pista","graves","nenhum","centro","delirio"]],
 ["09","minhocão","domingo de manhã, sem carro.","centro",["manha","andando","silencio","atividade","centro","real"]],
 ["10","recém-inaugurada linha laranja","higienópolis-mackenzie. todo mundo perdido.","consolação",["tarde","andando","silencio","involuntario","centro","delirio"]],
 ["11","parque augusta","cachorródromo. cachorro é apresentação.","consolação",["tarde","andando","silencio","atividade","centro","real"]],
 ["12","obra do metrô na antônia de queirós","contemplar um buraco junto é um teste.","consolação",["tarde","andando","silencio","involuntario","centro","delirio"]],
 ["13","cruzamento frei caneca x peixoto gomide","fique parado. a cidade passa por você.","bela vista",["tarde","andando","conversa","involuntario","centro","delirio"]],
 ["14","smart fit shopping center 3","saída de dois metrôs. fluxo máximo.","paulista",["manha","andando","silencio","atividade","centro","sair"]],
 ["15","mundo pensante","quinta a sábado até 5h. fique na área externa.","bixiga",["madrugada","calcada","show","nenhum","centro","historia"]],
 ["16","funilaria","escreva algo na parede.","bixiga",["madrugada","pista","show","nenhum","centro","historia"]],
 ["17","13 de maio","uma esquina, seis bares, samba no domingo.","bixiga",["noite","calcada","conversa","nenhum","centro","real"]],
 ["18","madame satã","casarão dos anos 30. se perca ali.","bela vista",["madrugada","pista","graves","nenhum","centro","historia"]],
 ["19","beleléu","roda de samba de domingo na calçada.","barra funda",["tarde","calcada","show","atividade","oeste","real"]],
 ["20","festa iracema no suei","depois das 21h30 o salão vira pista.","barra funda",["noite","pista","show","atividade","oeste","historia"]],
 ["21","rua do baiuca","todo mundo em pé na rua.","barra funda",["noite","calcada","conversa","nenhum","oeste","real"]],
 ["22","casa de show do mamãe bar","apertado, o que já resolve metade.","barra funda",["noite","pista","show","atividade","oeste","historia"]],
 ["23","d-edge","vai até 8h. condições extremas.","barra funda",["madrugada","pista","graves","nenhum","oeste","delirio"]],
 ["24","eskina pacaembu","24 horas, bilhar, mesa na rua.","santa cecília",["madrugada","mesa","conversa","nenhum","oeste","sair"]],
 ["25","algum sesc","pompeia. a arquitetura faz o trabalho.","pompeia",["tarde","andando","silencio","atividade","oeste","real"]],
 ["26","área de fumantes do milo garage","a clássica conversa de pedir fogo.","pompeia",["madrugada","calcada","show","nenhum","oeste","historia"]],
 ["27","fatiado discos","vá direto pra varanda dos fundos.","sumaré",["tarde","mesa","conversa","atividade","oeste","real"]],
 ["28","rua do arlete","poucas mesas. fique no balcão.","vila madalena",["noite","calcada","conversa","nenhum","oeste","real"]],
 ["29","fachada","entrada invisível. 23h às 5h.","pinheiros",["madrugada","pista","graves","fila","oeste","historia"]],
 ["30","picles","karaokê. cantar mal é intimidade.","pinheiros",["madrugada","pista","show","atividade","oeste","historia"]],
 ["31","fatz delícias às 3h de uma sexta","ninguém ali está no seu melhor.","pinheiros",["madrugada","mesa","conversa","involuntario","oeste","sair"]],
 ["32","benedito calixto","sábado de feira, chorinho ao fim.","pinheiros",["tarde","andando","show","atividade","oeste","real"]],
 ["33","lojinha da casa natura musical","show de pé: duas horas lado a lado.","pinheiros",["noite","andando","show","atividade","oeste","real"]],
 ["34","academia gaviões da joão moura","24 horas. disciplina é atraente.","pinheiros",["manha","andando","silencio","atividade","oeste","sair"]],
 ["35","ciclovia da faria lima de patinete","alto risco, alta recompensa.","pinheiros",["tarde","andando","silencio","atividade","oeste","delirio"]],
 ["36","farmácia do ipq","fila de retirada. vulnerabilidade mútua.","cerqueira césar",["manha","andando","silencio","fila","oeste","delirio"]],
 ["37","atlética da medusp","av. dr. arnaldo, 455. boa sorte.","cerqueira césar",["noite","pista","graves","atividade","oeste","delirio"]],
 ["38","campeonato de xadrez no ccsp","as mesas ficam na entrada. perca.","vergueiro",["tarde","mesa","silencio","atividade","sul","real"]],
 ["39","café da cinemateca brasileira","tela ao ar livre. cinéfilo carente.","vila clementino",["tarde","mesa","silencio","atividade","sul","real"]],
 ["40","chácara klabin","escada rolante longa. tempo pra olhar.","vila mariana",["noite","andando","silencio","involuntario","sul","delirio"]],
 ["41","esteira de bagagem em congonhas","ninguém tem pra onde ir. público cativo.","congonhas",["tarde","andando","silencio","involuntario","sul","delirio"]],
];

/* ---------------- as perguntas ---------------- */
const Q = [
 {p:"A que hora do dia você é uma pessoa melhor?", peso:3,
  o:[["De manhã, antes de tudo","manha"],["No fim da tarde","tarde"],
     ["Perto da meia-noite","noite"],["Às quatro da manhã","madrugada"]]},
 {p:"Você prefere estar", peso:2,
  o:[["Sentado numa mesa","mesa"],["Em pé na calçada","calcada"],
     ["No meio da pista","pista"],["Andando sem destino","andando"]]},
 {p:"Volume ideal do ambiente", peso:2,
  o:[["Silêncio, ou quase","silencio"],["Conversa de bar","conversa"],
     ["Show, alguém tocando","show"],["Alto demais pra conversar","graves"]]},
 {p:"Você precisa de um pretexto pra falar com alguém?", peso:3,
  o:[["Sim, uma atividade em comum","atividade"],["Sim, uma fila serve","fila"],
     ["Não, eu chego","nenhum"],["Prefiro que aconteça por acaso","involuntario"]]},
 {p:"Onde você já está, na prática?", peso:3,
  o:[["Centro","centro"],["Zona oeste","oeste"],
     ["Zona sul","sul"],["Me desloco, tanto faz","*"]]},
 {p:"Sinceramente, você quer", peso:2,
  o:[["Conhecer alguém de verdade","real"],["Uma história pra contar","historia"],
     ["Acreditar que ainda é possível","delirio"],["Só sair de casa","sair"]]},
];

const PERFIL = {
 manha:"Você é da manhã, o que reduz a concorrência.",
 tarde:"Você é do fim da tarde, o melhor horário e o mais desperdiçado.",
 noite:"Você é da meia-noite, junto com todo mundo.",
 madrugada:"Você é das quatro da manhã, onde as decisões pioram e as histórias melhoram."
};
const DESEMPATE = [17,3,29,8,36,12,40,22,5,33,19,41,9,26,14,30,1,37,23,6,
                   34,11,27,2,38,16,7,31,20,10,25,39,4,28,13,35,21,15,32,24,18];

let etapa = 0, resp = [];
const app = document.getElementById("app");

function pontuar(){
  const sel = resp.map((i,q)=>Q[q].o[i][1]);
  const total = Q.reduce((s,q,i)=> s + (sel[i]==="*"?0:q.peso), 0) || 1;
  return L.map((lug,idx)=>{
    let s = 0;
    sel.forEach((tag,i)=>{ if(tag!=="*" && lug[4].includes(tag)) s += Q[i].peso; });
    return {lug, s, ordem:DESEMPATE.indexOf(idx+1)};
  }).sort((a,b)=> b.s-a.s || a.ordem-b.ordem)
    .slice(0,3)
    .map(r=>({...r, pct: Math.round(r.s/total*100)}));
}

function dobras(){
  return '<div class="dobras" aria-hidden="true">' +
    Q.map((_,i)=>`<i class="${i<etapa?"ok":i===etapa?"now":""}"></i>`).join("") +
    '</div>';
}

function verPergunta(){
  const q = Q[etapa];
  app.innerHTML = dobras() +
    `<p class="contador">Pergunta ${etapa+1} de ${Q.length}</p>
     <h2 class="pergunta">${q.p}</h2>
     <div class="opcoes">` +
    q.o.map((o,i)=>`<button class="op" data-i="${i}">
        <span class="k">${String.fromCharCode(65+i)}</span><span>${o[0]}</span></button>`).join("") +
    `</div>` +
    (etapa>0?`<button class="voltar" id="volta">← pergunta anterior</button>`:"");

  app.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>{
    resp[etapa] = +b.dataset.i;
    etapa++;
    etapa < Q.length ? verPergunta() : verResultado();
    window.scrollTo({top:0,behavior:"instant"});
  }));
  const v = document.getElementById("volta");
  if(v) v.addEventListener("click",()=>{ etapa--; verPergunta(); });
  const first = app.querySelector("button.op");
  if(first) first.focus({preventScroll:true});
}

function verResultado(){
  const top = pontuar();
  const hora = Q[0].o[resp[0]][1];
  app.innerHTML =
    `<div class="carimbo"><b>resultado · 3 de 41</b><strong>Seus endereços</strong></div>
     <p class="perfil">${PERFIL[hora]} Com o resto das suas respostas, a cidade se reduz a estes três lugares.</p>
     <ol class="res">` +
    top.map((r,i)=>`<li>
        <div class="cab">
          <span class="pos">${i+1}º</span>
          <span class="num">${r.lug[0]}</span>
          <h3 class="nome">${r.lug[1]}</h3>
        </div>
        <p class="nota">${r.lug[2]}</p>
        <p class="meta">${r.lug[3]} · compatibilidade ${r.pct}%</p>
      </li>`).join("") +
    `</ol>
     <div class="acoes">
       <button id="copiar">Copiar resultado</button>
       <button class="alt" id="refazer">Responder de novo</button>
     </div>`;

  document.getElementById("refazer").addEventListener("click",()=>{
    etapa = 0; resp = []; verPergunta(); window.scrollTo({top:0,behavior:"instant"});
  });
  document.getElementById("copiar").addEventListener("click",async e=>{
    const txt = "Onde eu vou encontrar o amor da minha vida em SP:\n" +
      top.map((r,i)=>`${i+1}. ${r.lug[1]} (${r.lug[3]})`).join("\n");
    try{ await navigator.clipboard.writeText(txt); e.target.textContent = "Copiado"; }
    catch(_){ e.target.textContent = "Copie à mão, o navegador não deixou"; }
    setTimeout(()=>{ e.target.textContent = "Copiar resultado"; }, 2200);
  });
}

verPergunta();
</script>
</body>
</html>
